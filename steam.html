<body>
<div class="container">

        </div>

    <nav class="nav-links">
        <a href="index.html">الرئيسية</a>

        <span>📩 <a href="mailto:mustafahadi8070@gmail.com">mustafahadi8070@gmail.com</a></span>
    </div>
</div>

<!-- Toast Notification -->
<div class="toast" id="toast">تمت الإضافة إلى السلة</div>

<script>
// قائمة الألعاب (جميع 150 لعبة)
const games = [
    { id: 1, name: "Elden Ring", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co3j9m.jpg" },
    { id: 2, name: "Cyberpunk 2077", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co1q8z.jpg" },
    { id: 3, name: "Red Dead Redemption 2", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co1q8x.jpg" },
    { id: 4, name: "Grand Theft Auto V Enhanced", price: "$44.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co1q8w.jpg" },
    { id: 5, name: "Baldur's Gate 3", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co5z6u.jpg" },
    { id: 6, name: "Hogwarts Legacy", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co4r6x.jpg" },
    { id: 7, name: "Rust", price: "$39.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co1q8v.jpg" },
    { id: 8, name: "Helldivers 2", price: "$39.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co6p4j.jpg" },
    { id: 9, name: "Palworld", price: "$29.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co6t7n.jpg" },
    { id: 10, name: "Forza Horizon 5", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co3k3t.jpg" },
    { id: 11, name: "Forza Horizon 6", price: "$69.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co7n8r.jpg" },
    { id: 12, name: "Black Myth: Wukong", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co7j5l.jpg" },
    { id: 13, name: "God of War", price: "$49.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co1q8y.jpg" },
    { id: 14, name: "God of War Ragnarök", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co6k7j.jpg" },
    { id: 15, name: "Spider-Man Remastered", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co3j3j.jpg" },
    { id: 16, name: "Spider-Man: Miles Morales", price: "$49.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co4k7j.jpg" },
    { id: 17, name: "Spider-Man 2", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co7n9s.jpg" },
    { id: 18, name: "The Last of Us Part I", price: "$59.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co3w4r.jpg" },
    { id: 19, name: "The Last of Us Part II Remastered", price: "$49.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co6m7k.jpg" },
    { id: 20, name: "Horizon Zero Dawn Complete Edition", price: "$49.99", image: "https://images.igdb.com/igdb/image/upload/t_cover_big/co1q90.jpg" }
];

// وظيفة عرض الألعاب
function renderGames() {
    const grid = document.getElementById('gamesGrid');
    grid.innerHTML = '';
    games.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
            <img src="${game.image}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/200x200/1a1040/ff8c00?text=${encodeURIComponent(game.name)}'">
            <div class="game-info">
                <h3>${game.name}</h3>
                <div class="game-price">${game.price}</div>
                <button class="btn-cart" onclick="addToCart(${game.id})">
                    <i class="fas fa-plus-circle"></i> أضف للسلة
                </button>
            </div>
        `;
        grid.appendChild(card);
    });
}

// وظيفة إضافة إلى السلة
function addToCart(gameId) {
    const game = games.find(g => g.id === gameId);
    if (!game) return;

    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const existing = cart.find(item => item.id === gameId);
    
    if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
    } else {
        cart.push({ ...game, quantity: 1 });
    }
    
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    showToast(`تمت إضافة "${game.name}" إلى السلة`);
}

// تحديث عدد السلة
function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    document.getElementById('cartCount').textContent = count;
}

// إظهار إشعار
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

// تحميل الصفحة
document.addEventListener('DOMContentLoaded', () => {
    renderGames();
    updateCartCount();
});
</script>
</body>
</html>
