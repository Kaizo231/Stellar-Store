<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Store – سلة المشتريات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header class="header">
        <div class="logo">
            <h1>Stellar Store</h1>
            <span>المتجر الرقمي الأول</span>
        </div>
        <div class="social-icons">
            <a href="https://discord.gg/4xdy38BU9E" target="_blank" rel="noopener noreferrer"><i class="fab fa-discord"></i></a>
            <a href="https://www.instagram.com/stellatstore/" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
            <a href="cart.html" class="cart-icon">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </a>
        </div>
    </header>

    <nav class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="netflix.html">نتفليكس</a>
        <a href="steam.html">ستيم</a>
        <a href="hosting.html">هوستات</a>
    </nav>

    <div class="cart-container">
        <h2 style="color: #ff8c00; text-align: center; font-size: 2rem; margin: 20px 0;">
            <i class="fas fa-shopping-cart"></i> سلة المشتريات
        </h2>
        
        <div id="cartItems"></div>
        
        <div class="cart-total" id="cartTotal">
            <h3>المجموع: <span id="totalPrice">$0.00</span></h3>
        </div>

        <!-- ====== نموذج بيانات العميل ====== -->
        <div class="order-form" id="orderForm">
            <h3><i class="fas fa-user-edit"></i> معلومات الطلب</h3>
            <p style="color: #928bb8; text-align: center; margin-bottom: 20px; font-size: 0.95rem;">يرجى تعبئة البيانات التالية لإكمال الطلب</p>
            
            <div class="form-group">
                <label>الاسم الكامل <span class="required">*</span></label>
                <input type="text" id="customerName" placeholder="أدخل اسمك الكامل" autocomplete="name">
                <div class="form-error" id="nameError">الاسم مطلوب</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>البلد <span class="required">*</span></label>
                    <input type="text" id="customerCountry" placeholder="مثال: العراق، السعودية، مصر" autocomplete="country">
                    <div class="form-error" id="countryError">البلد مطلوب</div>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف <span class="required">*</span></label>
                    <input type="tel" id="customerPhone" placeholder="مثال: 07712345678" autocomplete="tel">
                    <div class="form-error" id="phoneError">رقم الهاتف مطلوب</div>
                </div>
            </div>

            <div class="form-group">
                <label>يوزر إنستغرام <span class="required">*</span></label>
                <input type="text" id="customerInstagram" placeholder="@username أو الرابط" autocomplete="off">
                <div class="form-error" id="instagramError">يوزر إنستغرام مطلوب</div>
            </div>

            <br>
            <button class="btn-submit-order" id="submitOrderBtn" onclick="sendOrder()">
                <i class="fas fa-paper-plane"></i> إرسال الطلب
            </button>
        </div>

        <div style="text-align: center; margin-top: 15px;">
            <button class="btn-secondary" onclick="clearCart()" style="margin-right: 15px;">
                <i class="fas fa-trash"></i> إفراغ السلة
            </button>
            <a href="steam.html" class="btn-secondary" style="display: inline-block; margin-top: 10px;">
                <i class="fas fa-arrow-right"></i> متابعة التسوق
            </a>
        </div>
    </div>

    <div class="footer">
        <span>2026 Stellar Store</span>
        <span>📩 <a href="mailto:mustafahadi8070@gmail.com">mustafahadi8070@gmail.com</a></span>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1543400232237273201/fpESUrDcPbESDCgnw6egw2yCIvtPyTpJ423PEvzuFEHoixLRosCWOgUimw6Recoctsbl';

// ====== عرض محتويات السلة ======
function renderCart() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const container = document.getElementById('cartItems');
    const totalSpan = document.getElementById('totalPrice');
    
    if (cart.length === 0) {
        container.innerHTML = `
            <div class="empty-cart">
                <i class="fas fa-shopping-cart"></i>
                <h3>السلة فارغة</h3>
                <p>أضف بعض المنتجات من المتجر</p>
                <br>
                <a href="steam.html" class="btn-primary" style="font-size: 1rem; padding: 12px 30px;">
                    <i class="fas fa-arrow-right"></i> تسوق الآن
                </a>
            </div>
        `;
        totalSpan.textContent = '$0.00';
        document.getElementById('cartTotal').style.display = 'none';
        document.getElementById('orderForm').style.display = 'none';
        return;
    }
    
    document.getElementById('cartTotal').style.display = 'block';
    document.getElementById('orderForm').style.display = 'block';
    let total = 0;
    let html = '';
    
    cart.forEach((item, index) => {
        let priceNum = 0;
        let currency = '$';
        
        if (item.price && item.price.includes('د.ع')) {
            const num = parseFloat(item.price.replace(/[^0-9.]/g, ''));
            priceNum = num / 1500;
            currency = 'د.ع';
        } else if (item.price) {
            priceNum = parseFloat(item.price.replace(/[^0-9.]/g, ''));
            currency = '$';
        } else {
            priceNum = 0;
            currency = '$';
        }
        
        const subtotal = priceNum * (item.quantity || 1);
        total += subtotal;
        
        const displayPrice = item.price || '$0.00';
        
        html += `
            <div class="cart-item">
                <div class="item-details">
                    <img src="${item.image || 'https://via.placeholder.com/60x60/1a1040/ff8c00?text=P'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/60x60/1a1040/ff8c00?text=${encodeURIComponent(item.name.substring(0, 3))}'">
                    <h4>${item.name}</h4>
                    <span>${displayPrice}</span>
                    <span style="color: #ffd9b3;">الكمية: ${item.quantity || 1}</span>
                    <span style="color: #ff8c00;">المجموع: ${currency}${subtotal.toFixed(2)}</span>
                </div>
                <button class="btn-danger" onclick="removeItem(${index})">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `;
    });
    
    container.innerHTML = html;
    totalSpan.textContent = `$${total.toFixed(2)}`;
    updateCartCount();
}

// ====== حذف عنصر ======
function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
    updateCartCount();
    showToast('تم حذف المنتج من السلة');
}

// ====== إفراغ السلة ======
function clearCart() {
    if (confirm('هل أنت متأكد من إفراغ السلة؟')) {
        localStorage.setItem('cart', '[]');
        renderCart();
        updateCartCount();
        showToast('تم إفراغ السلة');
    }
}

// ====== تحديث عدد السلة ======
function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    const cartCountElements = document.querySelectorAll('#cartCount');
    cartCountElements.forEach(el => el.textContent = count);
}

// ====== إظهار إشعار ======
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

// ====== التحقق من صحة النموذج ======
function validateForm() {
    let isValid = true;
    
    const name = document.getElementById('customerName');
    const country = document.getElementById('customerCountry');
    const phone = document.getElementById('customerPhone');
    const instagram = document.getElementById('customerInstagram');
    
    const nameError = document.getElementById('nameError');
    const countryError = document.getElementById('countryError');
    const phoneError = document.getElementById('phoneError');
    const instagramError = document.getElementById('instagramError');
    
    // إخفاء جميع الأخطاء
    document.querySelectorAll('.form-error').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('.form-group input').forEach(el => el.classList.remove('error'));
    
    // التحقق من الاسم
    if (!name.value.trim()) {
        nameError.classList.add('show');
        name.classList.add('error');
        isValid = false;
    }
    
    // التحقق من البلد
    if (!country.value.trim()) {
        countryError.classList.add('show');
        country.classList.add('error');
        isValid = false;
    }
    
    // التحقق من رقم الهاتف
    if (!phone.value.trim()) {
        phoneError.classList.add('show');
        phone.classList.add('error');
        isValid = false;
    } else if (phone.value.trim().length < 8) {
        phoneError.textContent = 'رقم الهاتف يجب أن يكون 8 أرقام على الأقل';
        phoneError.classList.add('show');
        phone.classList.add('error');
        isValid = false;
    } else {
        phoneError.textContent = 'رقم الهاتف مطلوب';
    }
    
    // التحقق من يوزر إنستغرام
    if (!instagram.value.trim()) {
        instagramError.classList.add('show');
        instagram.classList.add('error');
        isValid = false;
    }
    
    return isValid;
}

// ====== إرسال الطلب ======
async function sendOrder() {
    // التحقق من صحة النموذج
    if (!validateForm()) {
        showToast('❌ يرجى تعبئة جميع البيانات المطلوبة');
        return;
    }
    
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    if (cart.length === 0) {
        showToast('السلة فارغة! أضف بعض المنتجات أولاً');
        return;
    }
    
    // جلب بيانات العميل
    const customerName = document.getElementById('customerName').value.trim();
    const customerCountry = document.getElementById('customerCountry').value.trim();
    const customerPhone = document.getElementById('customerPhone').value.trim();
    const customerInstagram = document.getElementById('customerInstagram').value.trim();
    
    // تعطيل الزر لمنع الضغط المتكرر
    const submitBtn = document.getElementById('submitOrderBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
    
    let total = 0;
    let itemsList = cart.map(item => {
        let priceNum = 0;
        let currency = '$';
        
        if (item.price && item.price.includes('د.ع')) {
            const num = parseFloat(item.price.replace(/[^0-9.]/g, ''));
            priceNum = num / 1500;
            currency = 'د.ع';
        } else if (item.price) {
            priceNum = parseFloat(item.price.replace(/[^0-9.]/g, ''));
            currency = '$';
        } else {
            priceNum = 0;
            currency = '$';
        }
        
        const subtotal = priceNum * (item.quantity || 1);
        total += subtotal;
        return `• ${item.name} × ${item.quantity || 1} = ${currency}${subtotal.toFixed(2)}`;
    }).join('\n');
    
    const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    
    // بناء الرسالة المرسلة إلى ديسكورد
    const embed = {
        title: '🛒 طلب جديد من Stellar Store',
        color: 0xff8c00,
        fields: [
            {
                name: '👤 معلومات العميل',
                value: `**الاسم:** ${customerName}\n**البلد:** ${customerCountry}\n**رقم الهاتف:** ${customerPhone}\n**يوزر إنستغرام:** ${customerInstagram}`,
                inline: false
            },
            {
                name: '📦 المنتجات المطلوبة',
                value: itemsList || 'لا توجد منتجات',
                inline: false
            },
            {
                name: '💰 المجموع الكلي',
                value: `**$${total.toFixed(2)}**`,
                inline: true
            },
            {
                name: '📦 عدد المنتجات',
                value: `**${totalItems}** منتج`,
                inline: true
            }
        ],
        footer: {
            text: `تم الطلب في ${new Date().toLocaleString('ar-IQ')}`
        },
        timestamp: new Date().toISOString()
    };
    
    try {
        const response = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ embeds: [embed] })
        });
        
        if (response.ok) {
            showToast('✅ تم إرسال الطلب بنجاح! سيتم التواصل معك قريباً');
            localStorage.setItem('cart', '[]');
            // إعادة تعيين النموذج
            document.getElementById('customerName').value = '';
            document.getElementById('customerCountry').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('customerInstagram').value = '';
            document.querySelectorAll('.form-error').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.form-group input').forEach(el => el.classList.remove('error'));
            setTimeout(() => renderCart(), 1000);
            updateCartCount();
        } else {
            showToast('❌ حدث خطأ في إرسال الطلب. حاول مرة أخرى');
        }
    } catch (error) {
        showToast('❌ خطأ في الاتصال. تأكد من اتصالك بالإنترنت');
        console.error(error);
    } finally {
        // إعادة تفعيل الزر
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال الطلب';
    }
}

// ====== تحميل الصفحة ======
document.addEventListener('DOMContentLoaded', () => {
    renderCart();
    updateCartCount();
});
</script>
</body>
</html>
